services:
  # ---------- Python (Flask) ----------
  api-py:
    container_name: debug-refactor-py
    build:
      context: .
      target: python
    image: markmus11012020/debug-refactor:py
    profiles: ["python", "all"]
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_PATH: /data/users.db
      PASSWORDS_FILE: /data/passwords.txt
      BCRYPT_ROUNDS: "12"
      ACTIVE_USERS_MAXLEN: "5"
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      API_DEBUG: "0"
    volumes:
      - py_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Go (default) ----------
  api-go:
    container_name: debug-refactor-go
    build:
      context: .
      target: go
    image: markmus11012020/debug-refactor:go
    profiles: ["go", "all"]
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_PATH: /data/users.db
      PASSWORDS_FILE: /data/passwords.txt
      BCRYPT_ROUNDS: "12"
      ACTIVE_USERS_MAXLEN: "5"
      API_HOST: 0.0.0.0
      API_PORT: "5000"
    volumes:
      - go_data:/data
    healthcheck:
      # distroless не содержит curl/wget — проверка эндпоинтов делается
      # извне скриптом scripts/test_endpoints.sh.
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  py_data:
  go_data: